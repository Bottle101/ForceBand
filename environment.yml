name: emg2force
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - torch>=2.4
      - timm>=1.0.16
      - pytorch-lightning>=2.0
      - h5py>=3.0
      - numpy>=1.24
      - scipy>=1.10
      - matplotlib>=3.6
      - opencv-python>=4.8
      - tqdm>=4.64
# Note: install a CUDA-enabled torch build matching your driver, e.g.
#   pip install torch --index-url https://download.pytorch.org/whl/cu124
