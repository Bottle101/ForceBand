[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "emg2force"
version = "0.1.0"
description = "Fingertip force estimation from inertial sEMG (DINOv2 spectrogram encoder + Transformer)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.4",
    "timm>=1.0.16",
    "pytorch-lightning>=2.0",
    "h5py>=3.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.6",
    "opencv-python>=4.8",
    "tqdm>=4.64",
]

[tool.setuptools]
packages = ["emg2force"]
